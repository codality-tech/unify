<template>
    <div class="slds-is-relative">
        <lightning-spinner lwc:if={busy} alternative-text="Loading" size="small"></lightning-spinner>

        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
            <h2 class="slds-col slds-text-heading_small" data-id="heading">{heading}</h2>
            <lightning-button lwc:if={canCreate} label="New" onclick={handleNew} data-id="new"></lightning-button>
        </div>

        <div lwc:if={failure} class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
            <lightning-icon icon-name="utility:error" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
            <span data-id="failure">{failure}</span>
        </div>

        <div lwc:if={hasProblems} class="slds-scoped-notification slds-theme_warning slds-m-bottom_small" role="status">
            <p class="slds-text-title_bold">This blueprint has mistakes</p>
            <ul class="slds-list_dotted">
                <template for:each={problems} for:item="problem">
                    <li key={problem} data-id="problem">{problem}</li>
                </template>
            </ul>
        </div>

        <lightning-datatable
            lwc:if={hasRows}
            key-field="Id"
            columns={columns}
            data={rows}
            hide-checkbox-column
            onrowaction={handleRowAction}
        ></lightning-datatable>

        <p lwc:elseif={isEmpty} class="slds-text-color_weak slds-p-vertical_medium slds-text-align_center" data-id="empty">
            Nothing to show yet.
        </p>

        <div lwc:if={showPaging} class="slds-grid slds-grid_vertical-align-center slds-m-top_x-small">
            <span class="slds-col slds-text-color_weak" data-id="range">{range}</span>
            <lightning-button-group>
                <lightning-button label="Previous" disabled={onFirstPage} onclick={handlePrevious} data-id="previous"></lightning-button>
                <lightning-button label="Next" disabled={onLastPage} onclick={handleNext} data-id="next"></lightning-button>
            </lightning-button-group>
        </div>
    </div>
</template>
